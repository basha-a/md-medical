<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-labelledby="t">
  <title id="t">Illustration of traditional herbal medicines: mortar and pestle, medicated oil bottle and herbal jar under an arch with leaves</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f8f3"/>
      <stop offset="1" stop-color="#e3f2e8"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e7b47"/>
      <stop offset="1" stop-color="#0f3d24"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f5b65a" stop-opacity=".7"/>
      <stop offset="1" stop-color="#f5b65a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5521a"/>
      <stop offset=".45" stop-color="#d07a2c"/>
      <stop offset="1" stop-color="#8f4614"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a2c"/>
      <stop offset=".5" stop-color="#a26a42"/>
      <stop offset="1" stop-color="#6b3f24"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2ad74"/>
      <stop offset="1" stop-color="#c98a4b"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6efe8"/>
    </linearGradient>
    <clipPath id="archClip">
      <path d="M150 452V222a150 150 0 0 1 300 0v230z"/>
    </clipPath>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#1e7b47" fill-opacity=".18"/>
    </pattern>
    <!-- one leaf, pointing right from origin -->
    <g id="leaf">
      <path d="M0 0C16-24 56-34 92 0 56 34 16 24 0 0z"/>
      <path d="M4 0H84" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="600" height="560" rx="40" fill="url(#bg)"/>
  <rect x="28" y="28" width="144" height="108" fill="url(#dots)"/>
  <rect x="440" y="430" width="126" height="100" fill="url(#dots)"/>
  <circle cx="520" cy="92" r="46" fill="#fdf0db"/>
  <circle cx="520" cy="92" r="22" fill="#f0a53a" fill-opacity=".5"/>

  <!-- arch window -->
  <path d="M150 452V222a150 150 0 0 1 300 0v230z" fill="url(#arch)"/>
  <g clip-path="url(#archClip)">
    <circle cx="300" cy="235" r="120" fill="url(#sunGlow)"/>
    <circle cx="300" cy="235" r="62" fill="#f0a53a"/>
    <circle cx="300" cy="235" r="62" fill="none" stroke="#fdf0db" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 8"/>
    <path d="M150 352c40-30 80-34 120-14s90 22 180-22v136H150z" fill="#2f9a5c" fill-opacity=".55"/>
    <path d="M150 392c60-36 110-30 160-6s100 10 140-14v80H150z" fill="#145232"/>
  </g>
  <path d="M150 452V222a150 150 0 0 1 300 0v230" fill="none" stroke="#f0a53a" stroke-opacity=".6" stroke-width="3"/>

  <!-- left plant -->
  <path d="M118 448C112 380 92 300 96 196" stroke="#1a6a3e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="#2f9a5c">
    <use href="#leaf" transform="translate(112 400) rotate(-150) scale(.75)"/>
    <use href="#leaf" transform="translate(108 360) rotate(-25) scale(.8)"/>
    <use href="#leaf" transform="translate(101 318) rotate(-158) scale(.85)"/>
    <use href="#leaf" transform="translate(98 276) rotate(-30) scale(.8)"/>
    <use href="#leaf" transform="translate(96 236) rotate(-150) scale(.7)"/>
  </g>
  <use href="#leaf" fill="#5cb87d" transform="translate(96 198) rotate(-95) scale(.62)"/>

  <!-- right plant -->
  <path d="M484 448C492 380 510 300 504 186" stroke="#1a6a3e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="#1e7b47">
    <use href="#leaf" transform="translate(488 404) rotate(-30) scale(.75)"/>
    <use href="#leaf" transform="translate(494 362) rotate(-155) scale(.8)"/>
    <use href="#leaf" transform="translate(500 320) rotate(-22) scale(.85)"/>
    <use href="#leaf" transform="translate(504 276) rotate(-150) scale(.78)"/>
    <use href="#leaf" transform="translate(505 232) rotate(-35) scale(.7)"/>
  </g>
  <use href="#leaf" fill="#5cb87d" transform="translate(504 190) rotate(-85) scale(.62)"/>

  <!-- shelf -->
  <ellipse cx="300" cy="486" rx="250" ry="14" fill="#0f3d24" fill-opacity=".12"/>
  <rect x="58" y="448" width="484" height="26" rx="13" fill="url(#shelf)"/>
  <rect x="58" y="448" width="484" height="7" rx="3.5" fill="#f0c08c"/>

  <!-- amber oil bottle (thailam) -->
  <g>
    <rect x="148" y="286" width="34" height="26" rx="5" fill="#145232"/>
    <rect x="148" y="300" width="34" height="4" fill="#0f3d24"/>
    <rect x="154" y="310" width="22" height="22" fill="#8f4614"/>
    <path d="M134 346c0-10 8-16 18-16h26c10 0 18 6 18 16v88c0 8-6 14-14 14h-34c-8 0-14-6-14-14z" fill="url(#amber)"/>
    <rect x="142" y="368" width="46" height="52" rx="7" fill="#fdf0db"/>
    <use href="#leaf" fill="#1e7b47" transform="translate(152 386) rotate(-30) scale(.26)"/>
    <use href="#leaf" fill="#2f9a5c" transform="translate(165 388) rotate(-150) scale(.2)"/>
    <rect x="150" y="398" width="30" height="4" rx="2" fill="#c98a4b"/>
    <rect x="155" y="407" width="20" height="4" rx="2" fill="#e2ad74"/>
    <rect x="142" y="344" width="6" height="88" rx="3" fill="#ffffff" fill-opacity=".25"/>
  </g>

  <!-- mortar & pestle -->
  <g>
    <rect x="261" y="300" width="20" height="104" rx="10" fill="#c48a5c" transform="rotate(28 271 352)"/>
    <rect x="261" y="300" width="7" height="104" rx="3.5" fill="#ffffff" fill-opacity=".2" transform="rotate(28 271 352)"/>
    <!-- herbs in the bowl -->
    <use href="#leaf" fill="#2f9a5c" transform="translate(262 372) rotate(-120) scale(.42)"/>
    <use href="#leaf" fill="#5cb87d" transform="translate(296 372) rotate(-70) scale(.46)"/>
    <use href="#leaf" fill="#1e7b47" transform="translate(320 374) rotate(-40) scale(.36)"/>
    <path d="M222 372h156c0 44-30 70-78 70s-78-26-78-70z" fill="url(#wood)"/>
    <ellipse cx="300" cy="372" rx="78" ry="13" fill="#b67b51"/>
    <ellipse cx="300" cy="373" rx="66" ry="8" fill="#4e2f1c"/>
    <path d="M240 392c10 26 32 38 60 38" stroke="#ffffff" stroke-opacity=".18" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="266" y="438" width="68" height="12" rx="6" fill="#6b3f24"/>
  </g>

  <!-- herbal jar (lehyam) -->
  <g>
    <rect x="392" y="350" width="94" height="24" rx="9" fill="#f0a53a"/>
    <rect x="392" y="350" width="94" height="8" rx="4" fill="#f5c27a"/>
    <path d="M398 372h82v62c0 8-6 14-14 14h-54c-8 0-14-6-14-14z" fill="url(#jar)" stroke="#cfe0d4" stroke-width="2"/>
    <rect x="398" y="390" width="82" height="34" fill="#1e7b47"/>
    <use href="#leaf" fill="#ffffff" transform="translate(428 407) rotate(-30) scale(.24)"/>
    <use href="#leaf" fill="#cfe7d8" transform="translate(440 409) rotate(-150) scale(.2)"/>
    <rect x="404" y="376" width="6" height="64" rx="3" fill="#ffffff" fill-opacity=".7"/>
  </g>

  <!-- loose herbs and seeds on the shelf -->
  <use href="#leaf" fill="#2f9a5c" transform="translate(206 446) rotate(-8) scale(.32)"/>
  <use href="#leaf" fill="#1e7b47" transform="translate(360 446) rotate(-172) scale(.3)"/>
  <circle cx="372" cy="442" r="4" fill="#a5521a"/>
  <circle cx="382" cy="444" r="3" fill="#d07a2c"/>
  <circle cx="226" cy="443" r="3.5" fill="#a5521a"/>

  <!-- floating sparkles -->
  <g fill="#f0a53a">
    <path d="M70 196l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path d="M548 290l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  </g>
  <g fill="#1e7b47" fill-opacity=".5">
    <circle cx="230" cy="72" r="4"/>
    <circle cx="404" cy="58" r="3"/>
    <circle cx="558" cy="196" r="3"/>
  </g>
</svg>
